<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FACAI · Knowledge</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color-scheme:dark;background:#0b111b;color:#e9eff7}*{box-sizing:border-box}body{margin:0}header{padding:22px 5vw;border-bottom:1px solid #29384a;display:flex;gap:20px;flex-wrap:wrap}a{color:#83d9c7}main{max-width:1100px;margin:30px auto;padding:0 20px}h1{font-size:30px}p{line-height:1.7;color:#b1c0d1}.card{background:#121c2a;border:1px solid #29384a;border-radius:12px;padding:22px;margin:20px 0;min-width:0}input{padding:12px;background:#0b1421;color:#e9eff7;border:1px solid #36485d;border-radius:7px;width:100%;font:inherit}button,.link{display:inline-block;min-height:44px;margin:12px 8px 0 0;padding:11px 16px;border:1px solid #45605e;border-radius:7px;background:#25453e;color:#c3ffec;font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7}#message{color:#f2cd8c;overflow-wrap:anywhere}#items button{display:block;width:100%;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}.muted{font-size:13px;color:#b1c0d1}@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding:0 14px}.card{padding:18px}h1{font-size:24px}}
</style></head><body><header><strong>FACAI / ICS</strong><nav><a href="/workspace">意图工作区</a> · <a href="/evidence-center">Evidence / Proof</a> · <a href="/setup">设置</a></nav></header><main><h1>Knowledge Memory</h1><p>由 Owner 显式收录的已验收证明快照。保留当时的来源、推断和审查依据；存入知识库不会把 INFERENCE 自动变为 FACT。</p><div id="message" role="status" aria-live="polite"></div><form id="search" class="card"><label for="query">搜索标题、结论或标签</label><input id="query" maxlength="200" placeholder="输入关键词"><button>搜索</button><button id="previous" type="button">上一页</button><button id="next" type="button">下一页</button><p id="page" class="muted"></p></form><div class="grid"><section id="items" class="card"></section><section id="detail" class="card" hidden><h2 id="title"></h2><p id="current"></p><div id="source"></div><pre id="claims"></pre><details><summary>资产、证据与来源完整结构</summary><pre id="json"></pre></details></section></div></main><script>
const $=id=>document.getElementById(id);let offset=0;const limit=25;
function message(t){$('message').textContent=t}
async function api(path){const r=await fetch(path,{credentials:'same-origin'});if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname+location.search);throw Error('请先登录')}const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
async function open(id){try{const x=await api('/api/v1/knowledge/'+encodeURIComponent(id));$('detail').hidden=false;$('title').textContent=x.title;$('current').textContent=x.source_current?'来源仍与当前任务快照一致；验收性质为 Owner 审查。':'来源已是历史快照；保留原始验收，但不能当作当前任务结论。';$('source').replaceChildren();for(const [label,url] of [['查看任务证据','/evidence-center?mission='+encodeURIComponent(x.source.mission_id)],['下载来源 Artifact','/api/v1/missions/'+encodeURIComponent(x.source.mission_id)+'/trust/proofs/'+encodeURIComponent(x.source.proof_id)+'/download']]){const a=document.createElement('a');a.className='link';a.textContent=label;a.href=url;$('source').append(a)}$('claims').textContent=x.claims.map(c=>(c.lifecycle||'ACTIVE')+' / '+c.status+' · '+c.statement+'\n依据：'+(c.review?c.review.reason:'未知')).join('\n\n');$('json').textContent=JSON.stringify(x,null,2);history.replaceState(null,'','/knowledge?id='+encodeURIComponent(id))}catch(e){message(e.message)}}
async function load(){try{const result=await api('/api/v1/knowledge?q='+encodeURIComponent($('query').value)+'&limit='+limit+'&offset='+offset);$('items').replaceChildren();if(!result.items.length)$('items').textContent='尚无匹配资产。请先在证据中心验收快照，再显式收录。';for(const x of result.items){const b=document.createElement('button');b.textContent=x.title+'\n'+x.claim_statuses.join(' · ')+'\n'+x.tags.join(' / ')+' · '+x.created_at;b.onclick=()=>open(x.id);$('items').append(b)}$('page').textContent='第 '+(offset/limit+1)+' 页 · 当前 '+result.items.length+' 项';$('previous').disabled=offset===0;$('next').disabled=result.items.length<limit;message('')}catch(e){message(e.message)}}
$('search').onsubmit=e=>{e.preventDefault();offset=0;load()};$('previous').onclick=()=>{offset=Math.max(0,offset-limit);load()};$('next').onclick=()=>{offset+=limit;load()};(async()=>{await load();const id=new URL(location.href).searchParams.get('id');if(id)await open(id)})();
</script></body></html>
