name: FACAI development package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: facai-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test packaging/app/test/*.test.js
      - run: python -m pytest -q --junitxml=dist/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FACAI-validation-results
          path: dist/pytest.xml
          if-no-files-found: warn
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: FACAI-development-package
          path: dist/FACAI-v1.0-development.zip*
          if-no-files-found: error
